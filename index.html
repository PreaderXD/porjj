<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chicken</title>
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--panel:#181818;--panel2:#242424;--text:#f5f5f5;--muted:#aaa;--accent:#e6b800}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,Helvetica,sans-serif}button,input{font:inherit}.top{height:64px;display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:1px solid #292929;position:sticky;top:0;background:#101010;z-index:2}.brand{font-size:25px;font-weight:800;letter-spacing:-1px;color:var(--text);text-decoration:none}.brand span{color:var(--accent)}.search{display:flex;max-width:650px;flex:1;margin:auto}.search input{flex:1;min-width:0;background:#090909;border:1px solid #383838;border-radius:22px 0 0 22px;padding:12px 18px;color:white;outline:none}.search button,.pill{background:var(--panel2);border:1px solid #393939;color:white;padding:11px 18px;cursor:pointer}.search button{border-radius:0 22px 22px 0}.pill{border-radius:22px;text-decoration:none;white-space:nowrap}.layout{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{padding:20px 12px;border-right:1px solid #292929}.nav{display:block;padding:13px 16px;color:white;text-decoration:none;border-radius:10px}.nav.active,.nav:hover{background:#292929}main{padding:26px;min-width:0}.heading{font-size:24px;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:26px 18px}.video-card{border:0;text-align:left;background:transparent;color:inherit;cursor:pointer;padding:0;min-width:0}.thumb{aspect-ratio:16/9;background:#252525;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800;color:#e5c23d;overflow:hidden}.meta{display:flex;gap:12px;padding-top:12px}.avatar{width:38px;height:38px;border-radius:50%;background:#393939;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:bold}.vtitle{font-size:16px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:13px;margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere}.empty{color:var(--muted);padding:40px 0}.watch{max-width:1000px;margin:auto}.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}.player iframe,.player video{width:100%;height:100%;border:0}.watch h1{font-size:25px}.description{white-space:pre-wrap;line-height:1.55;color:#ddd}.back{margin-bottom:18px;display:inline-block;color:#ddd;cursor:pointer;background:none;border:0;padding:8px 0}.external{color:#f0ce44} @media(max-width:700px){.top{padding:0 12px;gap:10px}.brand{font-size:21px}.layout{grid-template-columns:1fr}aside{display:none}main{padding:18px 13px}.search{margin:0}.search input{padding:10px}.search button{padding:10px}.pill{padding:9px 11px}.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:20px 12px}.thumb{font-size:46px}.vtitle{font-size:14px}.avatar{width:32px;height:32px}}
</style></head><body>
<header class="top"><a class="brand" href="/">Chicken<span>●</span></a><form class="search" id="searchForm"><input id="searchInput" placeholder="Search videos" aria-label="Search videos"><button>Search</button></form><a class="pill" href="/dev.html">Studio</a></header>
<div class="layout"><aside><a class="nav active" href="/">⌂ &nbsp; Home</a></aside><main><section id="home"><h1 class="heading">Videos</h1><div id="videoGrid" class="grid"></div><p id="status" class="empty">Loading videos…</p></section><section id="watch" hidden></section></main></div>
<script>
const $=s=>document.querySelector(s);let allVideos=[];
function playableType(link){try{const u=new URL(link);if(/youtube\.com$|youtube-nocookie\.com$|youtu\.be$/.test(u.hostname)){let id=u.hostname==='youtu.be'?u.pathname.slice(1):u.searchParams.get('v');if(u.pathname.includes('/embed/'))id=u.pathname.split('/embed/')[1].split('/')[0];if(id)return{type:'youtube',id};}if(/\.(mp4|webm|ogg|m4v|mov)(\?|$)/i.test(u.href))return{type:'video'};}catch{}return{type:'link'};}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function card(v){const b=document.createElement('button');b.className='video-card';b.innerHTML=`<div class="thumb">${esc((v.thumbnail?.text||v.title||'C').slice(0,1).toUpperCase())}</div><div class="meta"><div class="avatar">${esc((v.name||v.title||'C').slice(0,1).toUpperCase())}</div><div><div class="vtitle">${esc(v.title)}</div><div class="sub">${esc(v.name||'')}<br>${esc(v.description||'')}</div></div></div>`;b.addEventListener('click',()=>{location.href='/?watch='+encodeURIComponent(v.id)});return b;}
function render(){const q=$('#searchInput').value.trim().toLowerCase();const list=allVideos.filter(v=>v.published&&[v.title,v.description,v.name].some(x=>String(x||'').toLowerCase().includes(q)));$('#videoGrid').replaceChildren(...list.map(card));$('#status').hidden=list.length>0;$('#status').textContent=allVideos.length?'No matching videos.':'No published videos yet.';}
function renderWatch(v){$('#home').hidden=true;const s=$('#watch');s.hidden=false;const p=playableType(v.link);let player='';if(p.type==='youtube')player=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(p.id)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${esc(v.title)}"></iframe>`;else if(p.type==='video')player=`<video controls autoplay playsinline src="${esc(v.link)}"></video>`;else player=`<div style="padding:20px;text-align:center">This link may not support embedded playback.<br><a class="external" target="_blank" rel="noopener noreferrer" href="${esc(v.link)}">Open video link</a></div>`;s.innerHTML=`<button class="back" onclick="location.href='/'">← Back to videos</button><div class="watch"><div class="player">${player}</div><h1>${esc(v.title)}</h1><div class="sub">${esc(v.name||'')}</div><p class="description">${esc(v.description||'')}</p></div>`;}
async function load(){try{const r=await fetch('/api/videos',{cache:'no-store'});if(!r.ok)throw Error('API '+r.status);const d=await r.json();allVideos=Array.isArray(d.videos)?d.videos:[];const id=new URLSearchParams(location.search).get('watch');if(id){const v=allVideos.find(x=>x.id===id&&x.published);if(v)renderWatch(v);else{$('#status').textContent='Video not found or not published.';$('#status').hidden=false;}}else render();}catch(e){$('#status').hidden=false;$('#status').textContent='Could not load videos. Check the Vercel API and database configuration.';}}
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();render()});$('#searchInput').addEventListener('input',render);load();setInterval(()=>{if(!new URLSearchParams(location.search).has('watch'))load()},15000);
</script></body></html>
